listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Dùng shared secret thay vì user/pass tĩnh (khớp 01_SYSTEM_DESIGN.md mục 9.3)
use-auth-secret
static-auth-secret=change_this_turn_shared_secret

realm=chatsphere.local
server-name=chatsphere-turn

# localhost dùng 127.0.0.1 khi test trên 1 máy.
# Test 2 máy khác mạng: đổi relay-ip thành IP LAN/public thật + mở port UDP 3478 và 49152-65535.
listening-ip=0.0.0.0
relay-ip=127.0.0.1

# Log để debug khi mới học
verbose
log-file=stdout

# Tắt các tính năng không cần khi dev
no-cli
no-tlsv1
no-tlsv1_1
