spring:
  task:
    execution:
      pool:
        core-size: 1
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway vẫn sở hữu schema, JPA chỉ đối chiếu
    open-in-view: false
    show-sql: false               # bật true khi cần soi SQL trong test

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      password:                   # container redis trong test không đặt password -> ghi đè rỗng

  mail:
    host: localhost               # chỉ để MailSenderAutoConfiguration tạo bean JavaMailSender;
    port: 1025                    # test @MockitoBean nó đi, không có kết nối SMTP thật nào

app:
  minio:
    # Không có MinIO container trong test: MinioBucketInitializer log lỗi rồi bỏ qua đúng như
    # thiết kế, còn MediaService được @MockitoBean ở test nào cần. Giá trị ở đây chỉ để
    # MinioProperties bind được và để assertManagedUrl có tiền tố ổn định mà kiểm tra.
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test12345
    bucket: chatsphere-test
  push:
    enabled: false              # không gọi ra mạng ngoài trong test
  mail:
    from: no-reply@chatsphere.test
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    # 32 byte base64 — đủ mạnh cho HMAC-SHA256. Chỉ dùng trong test, không phải secret thật.
    secret: dGVzdC1vbmx5LXNlY3JldC0zMi1ieXRlcy1taW5pbXVtLWxlbmd0aA==
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always        # test fail thì thấy ngay component nào DOWN
  health:
    redis:
      enabled: true               # Phase 1: đã có Redis container trong test
    mail:
      enabled: false              # SMTP bị mock trong test, health check sẽ luôn DOWN

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO