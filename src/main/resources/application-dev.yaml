spring:
  config:
    activate:
      on-profile: dev
    # Spring Boot KHÔNG tự đọc file .env. Dòng này nạp .env như một file properties
    # (cú pháp [.properties] báo cho Spring biết định dạng vì tên file không có đuôi).
    # "optional:" = không có file thì bỏ qua, không lỗi.
    # Biến môi trường thật của HĐH vẫn được ưu tiên cao hơn giá trị trong .env.
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chatsphere}
    username: ${DB_USERNAME:chatsphere}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}          # rỗng khi dùng MailHog (không có auth)
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mặc định tắt để dev offline với MailHog vẫn chạy được.
          # Gửi mail thật (Gmail/Brevo): set MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true trong .env
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # JavaMail mặc định chờ VÔ HẠN — SMTP treo sẽ giữ thread trong mailExecutor mãi mãi.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@chatsphere.local}
    from-name: ${MAIL_FROM_NAME:ChatSphere}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcy1taW5pbXVtLWxlbmd0aA==}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:chatsphere_admin}
    secret-key: ${MINIO_SECRET_KEY:minio_dev_password}
    bucket: ${MINIO_BUCKET:chatsphere-media}
  turn:
    secret: ${TURN_SECRET:change_this_turn_shared_secret}
    server-url: ${TURN_SERVER_URL:turn:localhost:3478}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.chatsphere: DEBUG
    org.springframework.web.socket: DEBUG
